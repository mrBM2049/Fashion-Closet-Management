<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Thread spool icon -->
  <!-- Spool body -->
  <rect x="4" y="14" width="32" height="20" rx="4" fill="#18181b"/>
  <!-- Spool flanges -->
  <rect x="2" y="10" width="36" height="7" rx="3" fill="#18181b"/>
  <rect x="2" y="31" width="36" height="7" rx="3" fill="#18181b"/>
  <!-- Thread wrap lines on spool -->
  <line x1="14" y1="14" x2="14" y2="34" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="20" y1="14" x2="20" y2="34" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="26" y1="14" x2="26" y2="34" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Thread coming off spool -->
  <path d="M38 24 Q52 8 60 24" stroke="#18181b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Wordmark -->
  <text x="52" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#18181b" letter-spacing="-0.5">ThreadShare</text>
</svg>
